name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Verify embedded web assets are current
        # bundle_web.dart regenerates lib/src/web_assets.g.dart from web/.
        # If it drifts from what's committed, the binary would ship stale assets.
        run: |
          dart run tool/bundle_web.dart
          git diff --exit-code lib/src/web_assets.g.dart
