<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px 14px; font: 12.5px/1.6 -apple-system, system-ui, sans-serif; color: #e6edf3; background: #0d1117; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
  td { padding: 4px 8px; border-bottom: 1px solid #30363d; }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: #161b22; }
  tr.on td { background: #1f6feb33; }
  .changed { color: #e3b341; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  button { font: inherit; color: inherit; background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 3px 10px; }
  button:disabled { opacity: .5; }
  pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; margin: 0; }
  .muted { color: #8b949e; }
</style>
</head>
<body>
  <table id="list"><tr><td class="muted">loading…</td></tr></table>
  <div class="row">
    <button id="deploy">Deploy…</button>
    <button id="rollback">Roll back…</button>
    <button id="sync">sync</button>
    <button id="reload">reload</button>
  </div>
  <pre id="out" class="muted">choose → preview → confirm → deploy, without leaving this view. Click a row to pick it for the page.</pre>
<script>
  const $ = (id) => document.getElementById(id);
  const show = (text, muted = false) => { $('out').textContent = text; $('out').className = muted ? 'muted' : ''; };
  const result = (run) => show(run.cancelled ? run.error || 'cancelled' : `${run.ok ? '✓' : '✗'} ${run.error || 'exit 0'}\n${run.output}`, run.cancelled);

  // The block's run: output, on load and after every run on the page. selected
  // is the row picked in the page's list (Templates), here or by emu.select.
  emu.onData(({ ok, data, error, selected }) => {
    $('list').replaceChildren(...(ok && Array.isArray(data) ? data : []).map((t) => {
      const tr = document.createElement('tr');
      tr.className = 'pick' + (selected?.path === t.path ? ' on' : '');
      tr.innerHTML = '<td></td><td></td>';
      tr.cells[0].textContent = t.path;
      tr.cells[1].textContent = t.changed ? 'changed' : '';
      tr.cells[1].className = 'changed';
      // Pick it for the whole page: the Templates list follows, and so does
      // every block that reads {{selected.*}}.
      tr.onclick = async () => {
        const r = await emu.select(t.path);
        if (!r.ok) emu.toast(r.error, 'error');
      };
      return tr;
    }));
    if (!ok && error) show(error);
  });

  // The dashboard draws this list outside the frame: the value, or null.
  const chooseEnv = (title) => emu.choose({
    title,
    options: [{ value: 'stage', label: 'stage — the test server' }, { value: 'prod', label: 'prod — live' }],
  });

  $('deploy').onclick = async () => {
    $('deploy').disabled = true;
    try {
      const env = await chooseEnv('Deploy to');
      if (!env) return show('cancelled', true);

      // 1. Preview: an action of this block, its stdout JSON comes back as data.
      const plan = await emu.run('plan', { input: { env } });
      if (!plan.ok) return emu.toast(`preview failed: ${plan.error}`, 'error');

      // 2. Ask — the dashboard draws these outside the frame, headed with this view's name.
      const answer = await emu.prompt({
        title: `Deploy to ${env}`,
        message: 'A note for the deploy log.',
        fields: [{ name: 'message', label: 'message', default: 'from the deploy view' }],
      });
      if (!answer) return show('cancelled', true);

      // 3. Run, with this view's words for it. deploy is confirm:, so the
      //    dashboard asks — once: these words, then emu.yaml's and the exact
      //    command. A frame can't skip that dialog.
      result(await emu.run('deploy', {
        input: { env, message: answer.message },
        confirm: {
          title: `Push ${plan.data.length} templates to ${env}?`,
          message: 'These go to the deploy repository right away.',
          detail: plan.data.map((t) => t.path).join('\n'),
        },
      }));
    } finally {
      $('deploy').disabled = false;
    }
  };

  // emu.confirm, then a confirm: action right away: the dashboard keeps the
  // same dialog and goes on to the command — one window, Run pressed again.
  $('rollback').onclick = async () => {
    const env = await chooseEnv('Roll back');
    if (!env) return;
    if (!await emu.confirm({ title: `Roll ${env} back?`, message: 'Restores the deploy before the last one.' })) return show('cancelled', true);
    result(await emu.run('rollback', { input: { env } }));
  };

  // A toolbar action listed under the block's actions.
  $('sync').onclick = async () => result(await emu.run('sync'));

  // Fetch this block's data again (onData gets it), and the Templates list.
  $('reload').onclick = async () => {
    for (const r of [await emu.refresh(), await emu.refresh('templates')]) if (!r.ok) emu.toast(r.error, 'error');
  };
</script>
</body>
</html>
